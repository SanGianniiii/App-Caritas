<head>

<!--
  APP CARITAS – prototipo funzionante in un solo file.
  - Mettere nella stessa cartella di questo file l'immagine del logo chiamata logo.png (vanno bene anche logo.jpg, logo.jpeg, logo.webp, logo.svg).
  - Pubblicazione: GitHub > Settings > Pages > Deploy from branch (main, cartella root).
  - Dati e accessi: Firebase (Authentication + Firestore). Regole in firestore.rules. App installabile (manifest.webmanifest + sw.js).
-->
<style>
:root{--red:#8f1a1e;--red2:#6c1216;--gold:#b9872d;--gold2:#ecd08a;--cream:#fffaf1;--ink:#2b2220;--mut:#7a6c63;--line:#e8dcc6;--ok:#2e7d32;--warn:#d99a00;--bad:#c62828}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--cream);color:var(--ink);font-size:15px}
h1,h2,h3{color:var(--red);margin:.2em 0 .5em}
button,input,select,textarea{font:inherit}
.btn{background:var(--red);color:#fff;border:0;border-radius:8px;padding:.55em 1em;cursor:pointer;font-weight:600}
.btn:hover{background:var(--red2)}
.btn.ghost{background:#fff;color:var(--red);border:1px solid var(--red)}
.btn.ghost:hover{background:#fbeeee}
.btn.gold{background:var(--gold)}
.btn.small{padding:.25em .65em;font-size:.85em;border-radius:6px}
.btn.danger{background:var(--bad)}
input,select,textarea{width:100%;padding:.55em .7em;border:1px solid #d9cbb2;border-radius:8px;background:#fff;color:var(--ink)}
input:focus,select:focus,textarea:focus{outline:2px solid var(--gold2);border-color:var(--gold)}
textarea{min-height:70px;resize:vertical}
label{display:block;font-size:.85em;color:var(--mut);margin-bottom:.2em;font-weight:600}
/* login */
.loginwrap{min-height:100%;display:flex;align-items:center;justify-content:center;padding:20px;background:linear-gradient(180deg,#fff 0%,var(--cream) 60%,#f6e6bf 100%)}
.card{background:#fff;border-radius:16px;border-top:6px solid var(--red);box-shadow:0 8px 30px rgba(143,26,30,.15);padding:28px;width:100%;max-width:430px}
.card .logo{display:block;margin:0 auto 10px;max-width:260px;max-height:230px;width:auto;height:auto}
.card h1{text-align:center;font-size:1.25em}
.card .sub{text-align:center;color:var(--mut);font-size:.9em;margin-bottom:16px}
.card .row{margin-bottom:12px}
.err{color:var(--bad);font-size:.9em;min-height:1.2em;margin:.4em 0}
.textlogo{display:flex;align-items:center;justify-content:center;gap:8px;color:var(--red);font-weight:800;font-size:1.8em;letter-spacing:.05em;margin-bottom:8px}
.textlogo small{display:block;color:var(--gold);font-size:.4em;letter-spacing:.12em}
.cross{width:34px;height:34px;position:relative;display:inline-block}
.cross:before,.cross:after{content:"";position:absolute;background:var(--red);border-radius:2px}
.cross:before{left:12px;top:0;width:10px;height:34px}.cross:after{top:12px;left:0;height:10px;width:34px}
/* shell */
header.top{background:linear-gradient(90deg,var(--red2),var(--red));color:#fff;display:flex;align-items:center;gap:12px;padding:8px 16px;border-bottom:4px solid var(--gold);position:sticky;top:0;z-index:20}
header.top .hlogo{height:44px;background:#fff;border-radius:8px;padding:2px 6px}
header.top .tl{font-weight:700;line-height:1.1}
header.top .tl small{display:block;font-weight:400;opacity:.85;font-size:.75em}
header.top .sp{flex:1}
header.top .who{font-size:.85em;text-align:right;line-height:1.2}
header.top .btn{background:#fff;color:var(--red)}
#burger{display:none;background:transparent;color:#fff;font-size:1.6em;padding:0 .3em}
.layout{display:flex;min-height:calc(100% - 62px)}
nav.side{width:250px;background:#fff;border-right:1px solid var(--line);padding:10px 0;flex-shrink:0}
nav.side a{display:block;padding:.6em 1.1em;color:var(--ink);text-decoration:none;border-left:4px solid transparent;cursor:pointer}
nav.side a:hover{background:#fbf3e2}
nav.side a.on{border-left-color:var(--red);background:#fbeeee;color:var(--red);font-weight:700}
main{flex:1;padding:18px 22px;min-width:0}
.banner{background:#fff3d6;border:1px solid var(--gold2);color:#6b4d0b;border-radius:8px;padding:.5em .8em;font-size:.85em;margin-bottom:14px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.toolbar .search{max-width:280px}
.tabs{display:flex;gap:4px;border-bottom:2px solid var(--line);margin-bottom:12px;flex-wrap:wrap}
.tabs button{background:none;border:0;padding:.5em 1em;cursor:pointer;color:var(--mut);font-weight:600;border-bottom:3px solid transparent;margin-bottom:-2px}
.tabs button.on{color:var(--red);border-bottom-color:var(--red)}
.tablewrap{overflow-x:auto;background:#fff;border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%}
th{background:#faf0d8;color:var(--red2);text-align:left;font-size:.82em;text-transform:uppercase;letter-spacing:.03em}
th,td{padding:.55em .75em;border-bottom:1px solid #f1e8d6;vertical-align:top}
tr:last-child td{border-bottom:0}
td.acts{white-space:nowrap;text-align:right}
td.acts .btn{margin-left:3px}
.empty{padding:22px;text-align:center;color:var(--mut)}
.badge{display:inline-block;padding:.1em .6em;border-radius:999px;font-size:.8em;font-weight:700;background:#f3e3bd;color:#7a5410}
.badge.ok{background:#dff0e0;color:var(--ok)}.badge.bad{background:#fbdede;color:var(--bad)}.badge.warn{background:#fff0c4;color:#8a6200}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px;margin-bottom:18px}
.kpi{background:#fff;border:1px solid var(--line);border-left:6px solid var(--gold);border-radius:10px;padding:12px 14px}
.kpi.ok{border-left-color:var(--ok)}.kpi.warn{border-left-color:var(--warn)}.kpi.bad{border-left-color:var(--bad)}
.kpi .v{font-size:1.9em;font-weight:800;color:var(--red)}
.kpi .l{font-weight:600}.kpi .s{font-size:.8em;color:var(--mut)}
.panel{background:#fff;border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:16px}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
.bar{display:flex;align-items:center;gap:8px;margin:5px 0;font-size:.9em}
.bar .n{width:130px;flex-shrink:0}.bar .t{flex:1;background:#f4ead2;border-radius:6px;height:16px;overflow:hidden}
.bar .t i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--red))}
.bar .c{width:36px;text-align:right;font-weight:700}
.step{display:flex;gap:4px;margin:8px 0 14px;flex-wrap:wrap}
.step span{padding:.25em .7em;border-radius:999px;background:#f3ead4;color:var(--mut);font-size:.82em;font-weight:600}
.step span.on{background:var(--red);color:#fff}
ul.tl{list-style:none;padding:0;margin:0}
ul.tl li{border-left:3px solid var(--gold);padding:2px 0 8px 12px;margin-left:6px}
ul.tl li b{color:var(--red)}
/* modal */
.overlay{position:fixed;inset:0;background:rgba(40,12,12,.5);display:flex;align-items:flex-start;justify-content:center;padding:30px 12px;overflow:auto;z-index:50}
.modal{background:#fff;border-radius:14px;border-top:6px solid var(--red);padding:20px;width:100%;max-width:560px}
.modal.wide{max-width:820px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid .full{grid-column:1/-1}
.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}
.chk{display:flex;align-items:center;gap:8px;font-size:.95em;color:var(--ink);font-weight:500;margin-top:1.4em}
.chk input{width:auto}
.mchk{display:flex;flex-wrap:wrap;gap:4px 14px;max-height:150px;overflow:auto;border:1px solid #d9cbb2;border-radius:8px;padding:8px}
.mchk label{display:flex;gap:5px;align-items:center;color:var(--ink);font-weight:500;margin:0}.mchk input{width:auto}
.irow{display:flex;gap:6px;margin-bottom:6px}.irow select{flex:3}.irow input{flex:1}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:.6em 1.2em;border-radius:8px;z-index:99;opacity:0;transition:.25s;pointer-events:none}
#toast.show{opacity:1}
@media(max-width:820px){
 #burger{display:block}
 nav.side{position:fixed;top:62px;bottom:0;left:-270px;z-index:30;transition:.25s;overflow:auto;box-shadow:4px 0 16px rgba(0,0,0,.2)}
 nav.side.open{left:0}
 main{padding:12px}.grid{grid-template-columns:1fr}
 header.top .who span{display:none}
}
@media print{header.top,nav.side,.toolbar,.tabs,.banner,.noprint{display:none!important}main{padding:0}}
header.top{padding-top:calc(8px + env(safe-area-inset-top))}
@media(max-width:820px){input,select,textarea{font-size:16px}.btn{min-height:40px}main{padding:14px 12px calc(14px + env(safe-area-inset-bottom))}}
.overlay.dlg{z-index:300;align-items:center}
.dlgbox{max-width:440px;text-align:center}
.dlgbox .dicon{width:48px;height:48px;border-radius:50%;margin:0 auto 8px;display:flex;align-items:center;justify-content:center;font-size:1.6em;font-weight:800;color:#fff;background:var(--gold)}
.dlgbox.ok{border-top-color:var(--ok)}.dlgbox.ok .dicon{background:var(--ok)}
.dlgbox.err{border-top-color:var(--bad)}.dlgbox.err .dicon{background:var(--bad)}
.dlgbox h3{margin:.1em 0 .4em}
.dlgbox .dmsg{color:var(--ink);line-height:1.45;margin:.2em 0 .6em}
.dlgbox .dmsg p{margin:.3em 0}
.dlgbox .dinp{margin-top:8px}
.dlgbox .cred{text-align:left;background:#faf0d8;border:1px solid var(--line);border-radius:8px;padding:10px 14px;margin:10px 0;font-size:.9em;color:var(--mut)}
.dlgbox .cred code{font-size:1.15em;font-weight:700;color:var(--red2);word-break:break-all}
.actions.center{justify-content:center;flex-wrap:wrap}
</style>
</head>
<body>
<noscript>Per usare l'app Caritas è necessario attivare JavaScript.</noscript>
<div id="app"></div>
<div id="toast"></div>

<script type="module">
import {initializeApp,deleteApp} from "https://www.gstatic.com/firebasejs/13.1.0/firebase-app.js";
import {getAuth,signInWithEmailAndPassword,signOut,onAuthStateChanged,createUserWithEmailAndPassword,updatePassword,reauthenticateWithCredential,EmailAuthProvider,sendPasswordResetEmail} from "https://www.gstatic.com/firebasejs/13.1.0/firebase-auth.js";
import {initializeFirestore,persistentLocalCache,persistentMultipleTabManager,collection,doc,setDoc,deleteDoc,getDoc,onSnapshot} from "https://www.gstatic.com/firebasejs/13.1.0/firebase-firestore.js";
const firebaseConfig={apiKey:"AIzaSyBrplLi9zyOBDRo1WmE1tLlfXQeCZcn3vg",authDomain:"caritas-app-c3085.firebaseapp.com",projectId:"caritas-app-c3085",storageBucket:"caritas-app-c3085.firebasestorage.app",messagingSenderId:"75509924852",appId:"1:75509924852:web:a27e6eacaf50777271efa1"};
const fbApp=initializeApp(firebaseConfig),fbAuth=getAuth(fbApp);
const fs=initializeFirestore(fbApp,{localCache:persistentLocalCache({tabManager:persistentMultipleTabManager()})});
'use strict';
/* =====================================================================
   UTILITÀ
   ===================================================================== */
const $=(s,e=document)=>e.querySelector(s);
const $$=(s,e=document)=>[...e.querySelectorAll(s)];
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const pad=n=>String(n).padStart(2,'0');
const today=()=>{const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
const addDays=(iso,n)=>{const d=new Date(iso+'T00:00:00');d.setDate(d.getDate()+n);return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
const fmt=d=>{if(!d)return'';const [y,m,g]=String(d).slice(0,10).split('-');return g&&m?`${g}/${m}/${y}`:String(d)};
let toastT;
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),2600)}
const UI=(()=>{
  const ICON={ok:'✓',err:'!',info:'i',ask:'?'};
  function dlg(o){return new Promise(res=>{
    const ov=document.createElement('div');ov.className='overlay dlg';
    ov.innerHTML=`<div class="modal dlgbox ${o.type}" role="dialog" aria-modal="true"><div class="dicon">${ICON[o.type]||'i'}</div><h3>${esc(o.title||'')}</h3><div class="dmsg">${o.html||esc(o.msg||'').replace(/\n/g,'<br>')}</div>${o.input?`<input class="dinp" value="${esc(o.input.value||'')}">`:''}<div class="actions center">${o.copy?'<button type="button" class="btn ghost" data-cp>Copia</button>':''}${o.cancel?`<button type="button" class="btn ghost" data-n>${esc(o.cancel)}</button>`:''}<button type="button" class="btn${o.danger?' danger':''}" data-y>${esc(o.ok||'OK')}</button></div></div>`;
    document.body.appendChild(ov);
    const inp=$('.dinp',ov),yes=$('[data-y]',ov),no=$('[data-n]',ov),cp=$('[data-cp]',ov);
    const close=v=>{document.removeEventListener('keydown',kd,true);ov.remove();res(v)};
    const kd=e=>{if(e.key==='Escape'){e.stopPropagation();if(!o.cancel&&!o.input&&o.type!=='ask'){close(true)}else close(o.input?null:false)}else if(e.key==='Enter'&&e.target.tagName!=='BUTTON'){e.preventDefault();yes.click()}};
    document.addEventListener('keydown',kd,true);
    yes.onclick=()=>close(o.input?inp.value:true);if(no)no.onclick=()=>close(o.input?null:false);
    if(cp)cp.onclick=()=>{try{navigator.clipboard.writeText(o.copy).then(()=>{cp.textContent='Copiato ✓'})}catch(e){cp.textContent='Copia non riuscita'}};
    (inp||yes).focus();
  })}
  const m=(type,title,extra)=>(msg,o)=>dlg(Object.assign({type,title,msg},extra,o)).then(()=>{});
  return{
    alert:m('info','Informazione'),ok:m('ok','Operazione completata'),err:m('err','Attenzione'),
    confirm:(msg,o)=>dlg(Object.assign({type:'ask',title:'Conferma',msg,ok:'Conferma',cancel:'Annulla'},o)),
    prompt:(msg,value,o)=>dlg(Object.assign({type:'ask',title:'Inserisci un valore',msg,ok:'Conferma',cancel:'Annulla',input:{value}},o))
  };
})();
function download(name,content,type){const b=new Blob([content],{type:type||'text/plain'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500)}

/* =====================================================================
   LIVELLO DATI (DB)
   Oggi: localStorage del browser. Per passare a Firebase/altro database
   basta riscrivere load(), save() e i metodi sotto mantenendo le stesse firme.
   ===================================================================== */
const COLLS=['persone','richieste','appuntamenti','colloqui','comunicazioni','articoli','movimenti','distribuzioni','inventari','volontari','turni','formazione','donatori','donazioni','eventi','enti','invii','riunioni','azioni','audit','utenti'];
const clean=o=>JSON.parse(JSON.stringify(o));
const werr=e=>{console.error(e);toast('Salvataggio non riuscito (permessi o connessione)')};
let rtm;function softRefresh(){clearTimeout(rtm);rtm=setTimeout(()=>{const a=document.activeElement;if(!Auth.user||(a&&/INPUT|TEXTAREA|SELECT/.test(a.tagName)))return;refresh()},250)}
const DB={
  data:{},unsubs:[],
  all(c){return this.data[c]||(this.data[c]=[])},
  get(c,id){return this.all(c).find(x=>x.id===id)},
  put(c,o){const a=this.all(c),i=a.findIndex(x=>x.id===o.id);if(i>=0)a[i]=o;else a.push(o);setDoc(doc(fs,c,o.id),clean(o)).catch(werr);return o},
  add(c,o){o.id=o.id||uid();o.creatoIl=new Date().toISOString();o.creatoDa=Auth.user?Auth.user.username:'sistema';this.put(c,o);Audit.log('crea',c,o.id);return o},
  update(c,id,p){const o=this.get(c,id);if(!o)return null;Object.assign(o,p,{modificatoIl:new Date().toISOString(),modificatoDa:Auth.user?Auth.user.username:'sistema'});this.put(c,o);Audit.log('modifica',c,id);return o},
  remove(c,id){const a=this.all(c),i=a.findIndex(x=>x.id===id);if(i>=0){a.splice(i,1);deleteDoc(doc(fs,c,id)).catch(werr);Audit.log('elimina',c,id)}},
  save(){},
  importAll(d){for(const c of COLLS){if(c==='utenti'||c==='audit')continue;(d[c]||[]).forEach(o=>this.put(c,o))}},
  start(){const first=new Set();return Promise.all(COLLS.map(c=>new Promise(res=>{
    this.unsubs.push(onSnapshot(collection(fs,c),s=>{
      this.data[c]=s.docs.map(d=>Object.assign(d.data(),{id:d.id}));
      if(c==='utenti'&&Auth.user){const m=this.get('utenti',Auth.user.id);if(m&&m.attivo===false)signOut(fbAuth);else if(m)Auth.user=m}
      if(!first.has(c)){first.add(c);res();return}
      if(!s.metadata.hasPendingWrites)softRefresh();
    },e=>{console.warn(c,e.code);this.data[c]=this.data[c]||[];res()}))})))},
  stop(){this.unsubs.forEach(u=>u());this.unsubs=[];this.data={}}
};
const Audit={log(azione,coll,rec,dett){DB.put('audit',{id:uid(),ts:new Date().toISOString(),utente:Auth.user?Auth.user.username:'-',azione,coll:coll||'',rec:rec||'',dett:dett||''})}};

/* AUTENTICAZIONE: Firebase Authentication (email + password) */
const toEmail=s=>{s=s.trim().toLowerCase();return s.includes('@')?s:s+'@caritas.local'};
const Auth={user:null,msg:'',
  async login(e,p){try{await signInWithEmailAndPassword(fbAuth,toEmail(e),p);return null}catch(x){return x.code==='auth/too-many-requests'?'Troppi tentativi. Riprova più tardi.':'Email o password non corretti.'}},
  logout(){Audit.log('logout','utenti',this.user&&this.user.id);return signOut(fbAuth)}
};
onAuthStateChanged(fbAuth,async u=>{
  if(!u){Auth.user=null;DB.stop();showLogin();if(Auth.msg){$('#e').textContent=Auth.msg;Auth.msg=''}return}
  try{
    const s=await getDoc(doc(fs,'utenti',u.uid));
    if(!s.exists()||s.data().attivo===false){Auth.msg="Account non abilitato. Contatta l'amministratore.";await signOut(fbAuth);return}
    Auth.user=Object.assign(s.data(),{id:u.uid});
    await DB.start();boot();
  }catch(e){Auth.msg=e.code==='permission-denied'?'Permessi negati: controlla le regole di Firestore e il documento utenti/<UID>.':'Errore di connessione ('+(e.code||e.message)+')';await signOut(fbAuth)}
});

/* =====================================================================
   RUOLI E MODULI (come da relazione)
   ===================================================================== */
const ALLMODS=['dashboard','persone','richieste','agenda','colloqui','comunicazioni','magazzino','distribuzioni','inventario','volontari','formazione','donatori','eventi','rete','equipe','report','audit','utenti','impostazioni'];
const ROLES={
  admin:{l:'Amministratore',mods:ALLMODS},
  parroco:{l:'Parroco / Supervisione',mods:['dashboard','equipe','report','audit']},
  coordinatore:{l:'Coordinatore Caritas',mods:['dashboard','persone','richieste','agenda','colloqui','comunicazioni','magazzino','distribuzioni','inventario','volontari','formazione','donatori','eventi','rete','equipe','report','audit']},
  frontoffice:{l:'Front Office',mods:['dashboard','persone','richieste','agenda','comunicazioni']},
  ascolto:{l:'Operatore Centro Ascolto',mods:['dashboard','persone','richieste','agenda','colloqui','rete','comunicazioni']},
  magazzino:{l:'Responsabile magazzino',mods:['dashboard','magazzino','distribuzioni','inventario']},
  respvol:{l:'Responsabile volontari',mods:['dashboard','volontari','formazione']},
  respdon:{l:'Responsabile donatori/eventi',mods:['dashboard','donatori','eventi']},
  volontario:{l:'Volontario',mods:['dashboard','miei_turni']}
};
const MODS=[
  {id:'dashboard',l:'Cruscotto'},
  {id:'persone',l:'Persone e nuclei',secs:['persone']},
  {id:'richieste',l:'Front Office – Richieste',secs:['richieste']},
  {id:'agenda',l:'Agenda appuntamenti',secs:['appuntamenti']},
  {id:'colloqui',l:'Centro Ascolto',secs:['colloqui']},
  {id:'comunicazioni',l:'Comunicazioni',secs:['comunicazioni']},
  {id:'magazzino',l:'Magazzino',secs:['articoli','movimenti']},
  {id:'distribuzioni',l:'Distribuzioni',secs:['distribuzioni']},
  {id:'inventario',l:'Inventario semestrale'},
  {id:'volontari',l:'Volontari e turni',secs:['volontari','turni']},
  {id:'formazione',l:'Formazione',secs:['formazione']},
  {id:'donatori',l:'Donatori e donazioni',secs:['donatori','donazioni']},
  {id:'eventi',l:'Eventi e raccolte',secs:['eventi']},

function giacenza(id){let g=0;for(const m of DB.all('movimenti')){if(m.articolo!==id)continue;const q=+m.quantita||0;g+=m.tipo==='Uscita'?-q:q}return Math.round(g*1000)/1000}
function label(c,id){
  if(!id)return'';const r=DB.get(c,id);if(!r)return'(eliminato)';
  switch(c){
    case'persone':case'volontari':return`${r.cognome} ${r.nome}`;
    case'utenti':return`${(r.cognome+' '+r.nome).trim()||r.username} (${r.username})`;
    case'articoli':case'donatori':case'enti':return r.nome;
    case'eventi':return r.titolo;
    case'riunioni':return fmt(r.data)+' – '+String(r.odg||'').slice(0,30);
    default:return id;
  }
}
function scarica(d){
  const tot={};for(const i of (d.items||[])){if(i.articolo&&+i.qta>0)tot[i.articolo]=(tot[i.articolo]||0)+ +i.qta}
  const ids=Object.keys(tot);if(!ids.length)return'Aggiungi almeno un bene prima di registrare la consegna.';
  for(const a of ids){if(giacenza(a)<tot[a])return`Giacenza insufficiente per "${label('articoli',a)}" (disponibili ${giacenza(a)}).`}
  for(const a of ids)DB.add('movimenti',{articolo:a,data:d.data||today(),tipo:'Uscita',quantita:tot[a],fonte:'Distribuzione',note:`Distribuzione ${d.tipo||''} – ${label('persone',d.persona)}`});
  return null;
}
async function generaMensile(){
  const data=await UI.prompt('Inserisci la data della distribuzione (AAAA-MM-GG):',today(),{title:'Distribuzione mensile'});if(data===null)return;
  if(!/^\d{4}-\d{2}-\d{2}$/.test(data)){UI.err('Data non valida. Usa il formato AAAA-MM-GG, per esempio 2026-11-15.',{title:'Data non valida'});return}
  const ym=data.slice(0,7);let n=0;
  for(const p of DB.all('persone')){
    if(p.statoPratica==='Chiusa')continue;
    if(DB.all('distribuzioni').some(d=>d.persona===p.id&&d.tipo==='Ordinaria'&&String(d.data).slice(0,7)===ym))continue;
    DB.add('distribuzioni',{data,tipo:'Ordinaria',persona:p.id,esito:'Pianificata',items:[],operatore:Auth.user.id});n++;
  }
  toast(n?`Create ${n} distribuzioni pianificate (persone con pratica non chiusa)`:'Nessuna nuova distribuzione da creare');refresh();
}
function magAlerts(){
  const t=today(),lim=addDays(t,30);
  const sotto=DB.all('articoli').filter(a=>+a.soglia>0&&giacenza(a.id)<=+a.soglia);
  const scad=DB.all('movimenti').filter(m=>m.tipo==='Entrata'&&m.scadenza&&m.scadenza<=lim&&giacenza(m.articolo)>0);
  return{sotto,scad};
}
const tone=v=>{v=String(v||'');if(/Urgente|Mancat|Annullat|Assente|Esaurit|Cessato|Senza esito/.test(v))return'bad';if(/Chiusa|Completata|Effettuato|Consegnata|Svolto|Concluso|Attivo/.test(v))return'ok';if(/Aperta|Programmato|Pianificata|Segnalata/.test(v))return'warn';return''};

function visibleFields(sc){return sc.fields.filter(f=>!f.roles||f.roles.includes(role()))}
function refOptions(c){
  let rows=DB.all(c);if(c==='utenti')rows=rows.filter(u=>u.attivo);
  return rows.map(r=>({id:r.id,l:label(c,r.id)})).sort((a,b)=>a.l.localeCompare(b.l,'it'));
}
function fieldHTML(f,v){
  const id='f_'+f.k;let val=v;
  if(val===undefined||val===null){val=f.def==='__today'?today():(f.def==='__me'?(Auth.user?Auth.user.id:''):(f.def!==undefined?f.def:''))}
  const req=f.req?' required':'';
  if(f.t==='check')return`<div class="chk"><input type="checkbox" id="${id}"${v?' checked':''}><label for="${id}" style="margin:0;color:inherit;font-weight:500">${esc(f.l)}</label></div>`;
  let inp='';
  if(f.t==='select')inp=`<select id="${id}"${req}><option value="">—</option>${f.o.map(o=>`<option${val===o?' selected':''}>${esc(o)}</option>`).join('')}</select>`;
  else if(f.t==='ref')inp=`<select id="${id}"${req}><option value="">—</option>${refOptions(f.ref).map(o=>`<option value="${o.id}"${val===o.id?' selected':''}>${esc(o.l)}</option>`).join('')}</select>`;
  else if(f.t==='multiref'){const sel=Array.isArray(v)?v:[];inp=`<div class="mchk" id="${id}">${refOptions(f.ref).map(o=>`<label><input type="checkbox" value="${o.id}"${sel.includes(o.id)?' checked':''}> ${esc(o.l)}</label>`).join('')||'<span style="color:var(--mut)">Nessun elemento disponibile</span>'}</div>`}
  else if(f.t==='items')inp=`<div id="${id}" class="items"></div><button type="button" class="btn small ghost" data-additem>+ Aggiungi bene</button>`;
  else if(f.t==='textarea')inp=`<textarea id="${id}"${req}>${esc(val)}</textarea>`;
  else inp=`<input id="${id}" type="${f.t==='number'?'number':f.t}"${f.t==='number'?' step="any"':''} value="${esc(val)}"${req}>`;
  const full=['textarea','items','multiref'].includes(f.t)?' class="full"':'';
  return`<div${full}><label for="${id}">${esc(f.l)}${f.req?' *':''}</label>${inp}</div>`;
}
function addItemRow(box,it){
  const r=document.createElement('div');r.className='irow';
  r.innerHTML=`<select class="i-art"><option value="">— bene —</option>${refOptions('articoli').map(o=>`<option value="${o.id}"${it&&it.articolo===o.id?' selected':''}>${esc(o.l)} (disp. ${giacenza(o.id)})</option>`).join('')}</select><input class="i-qta" type="number" min="0" step="any" placeholder="Qtà" value="${it?esc(it.qta):''}"><button type="button" class="btn small ghost">×</button>`;
  $('button',r).onclick=()=>r.remove();box.appendChild(r);
}
function initItems(form,values){
  $$('.items',form).forEach(box=>{const k=box.id.slice(2);(values&&values[k]||[]).forEach(it=>addItemRow(box,it));const add=box.parentElement.querySelector('[data-additem]');if(add)add.onclick=()=>addItemRow(box)});
}
function readForm(fields,form){
  const o={};
  for(const f of fields){
    const el=$('#f_'+f.k,form);if(!el)continue;
    if(f.t==='check')o[f.k]=el.checked;
    else if(f.t==='multiref')o[f.k]=$$('input:checked',el).map(i=>i.value);
    else if(f.t==='items')o[f.k]=$$('.irow',el).map(r=>({articolo:$('.i-art',r).value,qta:+$('.i-qta',r).value||0})).filter(i=>i.articolo&&i.qta>0);
    else if(f.t==='number')o[f.k]=el.value===''?'':+el.value;
    else o[f.k]=el.value.trim();
  }
  return o;
}
function openForm({title,fields,values,onSave,hook,wide}){
  values=values||{};
  const ov=document.createElement('div');ov.className='overlay';
  ov.innerHTML=`<div class="modal${wide?' wide':''}"><h3>${esc(title)}</h3><form autocomplete="off"><div class="grid">${fields.map(f=>fieldHTML(f,values[f.k])).join('')}</div><div class="err"></div><div class="actions"><button type="button" class="btn ghost" data-c>Annulla</button><button class="btn">Salva</button></div></form></div>`;
  document.body.appendChild(ov);
  const form=$('form',ov),err=$('.err',ov);
  initItems(form,values);if(hook)hook(form,ov);
  $('[data-c]',ov).onclick=()=>ov.remove();
  form.onsubmit=async e=>{
    e.preventDefault();err.textContent='';
    const obj=readForm(fields,form);
    const miss=fields.find(f=>f.req&&f.t!=='check'&&(obj[f.k]===''||obj[f.k]===undefined));
    if(miss){err.textContent=`Compila il campo: ${miss.l}`;return}
    const r=await onSave(obj);if(r){err.textContent=r}else ov.remove();
  };
  const first=$('input,select,textarea',form);if(first&&!values.id)first.focus();
  return ov;
}
function openRecord(coll,id,prefill,after){
  const sc=S[coll],old=id?DB.get(coll,id):null,fields=visibleFields(sc);
  openForm({title:(old?'Modifica ':'Nuovo/a ')+sc.sing,fields,values:Object.assign({},old||{},prefill||{}),wide:fields.length>6,
    hook:sc.hook,
    onSave:async obj=>{
      const e=sc.before&&await sc.before(obj,old);if(e)return e;
      let rec;if(old){DB.update(coll,id,obj);rec=DB.get(coll,id)}else rec=DB.add(coll,obj);
      if(sc.after)sc.after(rec,old);if(after)after(rec);refresh();toast('Salvato');
    }});
}
function modal(html,wide){
  const ov=document.createElement('div');ov.className='overlay';
  ov.innerHTML=`<div class="modal${wide?' wide':''}">${html}<div class="actions"><button class="btn ghost" data-c>Chiudi</button></div></div>`;
  document.body.appendChild(ov);$('[data-c]',ov).onclick=()=>ov.remove();return ov;
}

function openScheda(id){
  const p=DB.get('persone',id);if(!p)return;
  const ev=[];
  DB.all('richieste').filter(x=>x.persona===id).forEach(x=>ev.push([x.data,'Richiesta',`${x.motivo||''} – ${x.stato||''}`]));
  DB.all('appuntamenti').filter(x=>x.persona===id).forEach(x=>ev.push([x.data,'Appuntamento',`${x.tipo||''} ${x.ora||''} – ${x.stato||''}`]));
  DB.all('colloqui').filter(x=>x.persona===id).forEach(x=>ev.push([x.data,'Colloquio',`${x.esito||''}${x.prossimo?' – prossimo passo: '+x.prossimo:''}`]));
  DB.all('distribuzioni').filter(x=>x.persona===id).forEach(x=>ev.push([x.data,'Distribuzione '+(x.tipo||''),x.esito||'']));
  DB.all('invii').filter(x=>x.persona===id).forEach(x=>ev.push([x.data,'Rete',`${label('enti',x.ente)} – ${x.stato||''}`]));
  DB.all('comunicazioni').filter(x=>x.persona===id).forEach(x=>ev.push([x.data,'Comunicazione',`${x.tipo||''} (${x.canale||''})`]));
  ev.sort((a,b)=>String(b[0]).localeCompare(String(a[0])));
  const idx=OPT.percorso.indexOf(p.percorso);
  const ov=modal(`<h3>${esc(p.cognome)} ${esc(p.nome)}</h3>
   <div class="step">${OPT.percorso.map((s,i)=>`<span class="${i<=idx?'on':''}">${s}</span>`).join('')}</div>
   <p>Pratica: <span class="badge ${tone(p.statoPratica)}">${esc(p.statoPratica||'')}</span> · Nucleo: ${esc(p.nucleo||1)} · Tel: ${esc(p.telefono||'—')}</p>
   ${p.bisogni?`<p><b>Bisogni:</b> ${esc(p.bisogni)}</p>`:''}${p.talenti?`<p><b>Talenti:</b> ${esc(p.talenti)}</p>`:''}
   ${(p.note&&['admin','coordinatore','ascolto'].includes(role()))?`<p><b>Note riservate:</b> ${esc(p.note)}</p>`:''}
   <h3 style="font-size:1em">Cronologia</h3>${ev.length?`<ul class="tl">${ev.map(e=>`<li><b>${fmt(e[0])}</b> · ${esc(e[1])}<br><small>${esc(e[2])}</small></li>`).join('')}</ul>`:'<div class="empty">Nessun evento registrato</div>'}`,true);
  const sel=document.createElement('div');
  if(can('persone')){sel.innerHTML=`<label>Aggiorna fase del percorso</label><select>${OPT.percorso.map(o=>`<option${o===p.percorso?' selected':''}>${o}</option>`).join('')}</select>`;
    $('select',sel).onchange=e=>{DB.update('persone',id,{percorso:e.target.value});toast('Percorso aggiornato');ov.remove();refresh();openScheda(id)};
    $('.modal',ov).insertBefore(sel,$('.actions',ov))}
}

/* =====================================================================
   SEZIONI A TABELLA (CRUD GENERICO)
   ===================================================================== */
const state={mod:'dashboard',sec:{},q:{},inv:null};
function rowsFor(coll){
  let rows=DB.all(coll);
  if(state.mod==='miei_turni'&&coll==='turni'){const mine=DB.all('volontari').filter(v=>v.utente===Auth.user.id).map(v=>v.id);rows=rows.filter(t=>mine.includes(t.volontario))}
  return rows;
}
function cell(f,r){
  const v=r[f.k];
  switch(f.t){
    case'ref':return esc(label(f.ref,v));
    case'date':return esc(fmt(v));
    case'check':return v?'✔':'';
    case'multiref':return esc((v||[]).length?`${v.length}: `+v.map(i=>label(f.ref,i)).join(', '):'');
    case'items':return esc((v||[]).map(i=>`${label('articoli',i.articolo)} ×${i.qta}`).join(', '));
    case'textarea':return esc(String(v||'').slice(0,90));
    case'select':return v?`<span class="badge ${tone(v)}">${esc(v)}</span>`:'';
    default:return esc(v);
  }
}
function renderSection(host,coll,ro){
  const sc=S[coll],fields=visibleFields(sc).filter(f=>f.list),extra=sc.extra||[];
  const canDel=!ro&&isStaffAdmin()&&!sc.noDelete;
  host.innerHTML=`${sc.note?`<div class="banner">${esc(sc.note)}</div>`:''}
   <div class="toolbar"><input class="search" placeholder="Cerca…" value="${esc(state.q[coll]||'')}">${ro?'':'<button class="btn" data-new>+ Nuovo/a</button>'}${(sc.buttons||[]).map((b,i)=>`<button class="btn gold" data-b="${i}">${esc(b.l)}</button>`).join('')}<span class="sp"></span><button class="btn ghost small noprint" data-csv>Esporta CSV</button></div>
   <div class="tablewrap"><table><thead><tr>${fields.map(f=>`<th>${esc(f.l.replace(/\s*\(.*\)/,''))}</th>`).join('')}${extra.map(x=>`<th>${esc(x.l)}</th>`).join('')}<th></th></tr></thead><tbody></tbody></table></div>`;
  const tb=$('tbody',host),inp=$('.search',host);
  function draw(){
    const q=(state.q[coll]||'').toLowerCase();
    let rows=rowsFor(coll).slice();
    const k=sc.sort;rows.sort((a,b)=>{const c=String(a[k]||'').localeCompare(String(b[k]||''),'it');return sc.asc?c:-c});
    if(q)rows=rows.filter(r=>fields.map(f=>cell(f,r).replace(/<[^>]*>/g,'')).join(' ').toLowerCase().includes(q));
    if(!rows.length){tb.innerHTML=`<tr><td colspan="${fields.length+extra.length+1}" class="empty">Nessun elemento</td></tr>`;return}
    tb.innerHTML=rows.map(r=>`<tr data-id="${r.id}">${fields.map(f=>`<td>${cell(f,r)}</td>`).join('')}${extra.map(x=>`<td>${x.h(r)}</td>`).join('')}<td class="acts">${
      (sc.actions||[]).filter(a=>!ro||a.ro).filter(a=>!a.show||a.show(r)).map((a,i)=>`<button class="btn small gold" data-a="${sc.actions.indexOf(a)}">${esc(a.l)}</button>`).join('')}${
      (!ro&&!sc.noEdit&&!(sc.noEditIf&&sc.noEditIf(r)))?'<button class="btn small ghost" data-e>Modifica</button>':''}${
      (canDel&&!(sc.noDeleteIf&&sc.noDeleteIf(r)))?'<button class="btn small danger" data-d>Elimina</button>':''}</td></tr>`).join('');
  }
  draw();
  inp.oninput=()=>{state.q[coll]=inp.value;draw()};
  const nb=$('[data-new]',host);if(nb)nb.onclick=()=>openRecord(coll);
  $$('[data-b]',host).forEach(b=>b.onclick=()=>sc.buttons[+b.dataset.b].fn());
  $('[data-csv]',host).onclick=()=>exportCSV(coll);
  tb.onclick=e=>{
    const t=e.target.closest('button');if(!t)return;const id=t.closest('tr').dataset.id;
    if(t.dataset.e!==undefined)openRecord(coll,id);
    else if(t.dataset.d!==undefined){UI.confirm('Questa operazione non può essere annullata.',{title:'Eliminare questo elemento?',ok:'Elimina',danger:true}).then(y=>{if(y){DB.remove(coll,id);refresh();toast('Elemento eliminato')}})}
    else if(t.dataset.a!==undefined)sc.actions[+t.dataset.a].fn(id);
  };
}
function exportCSV(coll){
  const sc=S[coll],fields=visibleFields(sc);
  const q=v=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"';
  const lines=[fields.map(f=>q(f.l)).join(';')];
  for(const r of rowsFor(coll))lines.push(fields.map(f=>{let v=r[f.k];if(f.t==='ref')v=label(f.ref,v);else if(f.t==='multiref')v=(v||[]).map(i=>label(f.ref,i)).join(', ');else if(f.t==='items')v=(v||[]).map(i=>`${label('articoli',i.articolo)} x${i.qta}`).join(', ');else if(f.t==='check')v=v?'Sì':'';return q(v)}).join(';'));
  download(`caritas_${coll}_${today()}.csv`,'\ufeff'+lines.join('\n'),'text/csv;charset=utf-8');
  Audit.log('esporta',coll,'','CSV');
}

function bars(items){const mx=Math.max(1,...items.map(i=>i.v));return items.map(i=>`<div class="bar"><span class="n">${esc(i.l)}</span><span class="t"><i style="width:${Math.round(i.v/mx*100)}%"></i></span><span class="c">${i.v}</span></div>`).join('')}
function kpis(){
  const t=today(),ym=t.slice(0,7),yr=t.slice(0,4),K=[];
  const sem=(v,g,y)=>v<=g?'ok':(v<=y?'warn':'bad');
  const add=(mod,l,v,s,st)=>{if(can(mod))K.push({l,v,s,st:st||''})};
  const rq=DB.all('richieste').filter(r=>r.stato!=='Chiusa');
  add('richieste','Richieste aperte',rq.length,'in attesa di esito',sem(rq.length,5,15));
  const ur=rq.filter(r=>r.priorita==='Urgente').length;add('richieste','Urgenze aperte',ur,'da gestire subito',sem(ur,0,2));
  const ap=DB.all('appuntamenti').filter(a=>String(a.data).slice(0,7)===ym);
  const eff=ap.filter(a=>a.stato==='Effettuato').length,prog=ap.filter(a=>a.stato!=='Annullato').length;
  add('agenda','Appuntamenti del mese',`${eff}/${prog}`,'effettuati / programmati',prog?sem(100-Math.round(eff/prog*100),30,60):'');
  const mn=ap.filter(a=>a.stato==='Mancata presentazione').length;add('agenda','Mancate presentazioni',mn,'nel mese',sem(mn,2,5));
  const fu=DB.all('colloqui').filter(c=>c.dataFollowUp&&!c.followUpFatto&&c.dataFollowUp<=t).length;add('colloqui','Follow-up scaduti',fu,'da effettuare',sem(fu,0,3));
  add('persone','Pratiche attive',DB.all('persone').filter(p=>p.statoPratica!=='Chiusa').length,'persone/nuclei in carico');
  const al=magAlerts();add('magazzino','Beni sottoscorta',al.sotto.length,'sotto la soglia minima',sem(al.sotto.length,0,3));
  add('magazzino','Lotti in scadenza (30 gg)',al.scad.length,'verificare giacenza',sem(al.scad.length,0,3));
  const ds=DB.all('distribuzioni').filter(d=>String(d.data).slice(0,7)===ym);add('distribuzioni','Distribuzioni del mese',`${ds.filter(d=>d.esito==='Consegnata').length}/${ds.length}`,'consegnate / totali');
  add('volontari','Volontari attivi',DB.all('volontari').filter(v=>v.stato==='Attivo').length,'in servizio');
  const tu=DB.all('turni').filter(x=>String(x.data).slice(0,7)===ym);const sv=tu.filter(x=>x.stato==='Svolto').length;add('volontari','Turni del mese',`${sv}/${tu.length}`,'svolti / programmati (copertura)');
  const fz=DB.all('formazione').filter(x=>x.scadenza&&x.scadenza<=addDays(t,60)).length;add('formazione','Formazioni in scadenza',fz,'entro 60 giorni',sem(fz,0,2));
  const dz=DB.all('donazioni').filter(d=>d.tipo==='Economica'&&String(d.data).startsWith(yr)).reduce((s,d)=>s+(+d.valore||0),0);add('donatori','Donazioni economiche (anno)','€ '+dz.toLocaleString('it-IT'),'progressivo annuale');
  const az=DB.all('azioni').filter(a=>a.stato!=='Completata');const azs=az.filter(a=>a.scadenza&&a.scadenza<t).length;add('equipe','Azioni Equipe aperte',az.length,`${azs} scadute`,sem(azs,0,2));
  return K;
}

function renderInventario(host){

  host.innerHTML=`<h2>Inventario semestrale</h2><div class="toolbar"><button class="btn" id="bn">+ Nuova sessione di inventario</button></div>
   <div class="tablewrap"><table><thead><tr><th>Data</th><th>Stato</th><th>Righe</th><th>Differenze</th><th></th></tr></thead><tbody>${l.map(i=>`<tr><td>${fmt(i.data)}</td><td><span class="badge ${i.stato==='Approvato'?'ok':'warn'}">${esc(i.stato)}</span></td><td>${i.righe.length}</td><td>${i.righe.filter(r=>r.conta!==''&&r.conta!==undefined&&+r.conta!==+r.teorica).length}</td><td class="acts"><button class="btn small gold" data-o="${i.id}">Apri</button></td></tr>`).join('')||'<tr><td colspan="5" class="empty">Nessun inventario</td></tr>'}</tbody></table></div>`;

  $$('[data-o]',host).forEach(b=>b.onclick=()=>{state.inv=b.dataset.o;refresh()});

function renderInvDettaglio(host,id){

  host.innerHTML=`<h2>Inventario del ${fmt(inv.data)} <span class="badge ${open?'warn':'ok'}">${esc(inv.stato)}</span></h2>
   <div class="toolbar noprint"><button class="btn ghost" id="bb">← Elenco</button>${open?'<button class="btn gold" id="bs">Salva bozza</button><button class="btn" id="ba">Approva e applica rettifiche</button>':''}<button class="btn ghost" onclick="window.print()">Stampa</button></div>
   ${open?'<div class="banner">Inserisci la quantità contata. Dove c\'è differenza la motivazione è obbligatoria. Alla approvazione il confronto avviene con la giacenza di quel momento.</div>':''}
   <div class="tablewrap"><table><thead><tr><th>Bene</th><th>Ubicazione</th><th>Giacenza teorica</th><th>Contata</th><th>Differenza</th><th>Motivazione</th></tr></thead><tbody>${inv.righe.map((r,i)=>{const a=DB.get('articoli',r.articolo)||{};const th=open?giacenza(r.articolo):r.teorica;const d=r.conta===''||r.conta===undefined?'':Math.round((+r.conta-th)*1000)/1000;return`<tr data-i="${i}"><td>${esc(a.nome||'(eliminato)')} <small>${esc(a.unita||'')}</small></td><td>${esc(a.ubicazione||'')}</td><td>${th}</td><td>${open?`<input type="number" step="any" class="ic" value="${esc(r.conta)}" style="width:100px">`:esc(r.conta)}</td><td class="dd">${d===''?'':(d>0?'+'+d:d)}</td><td>${open?`<input class="im" value="${esc(r.motivo)}">`:esc(r.motivo)}</td></tr>`}).join('')}</tbody></table></div>`;
  $('#bb',host).onclick=()=>{state.inv=null;refresh()};
  if(!open)return;
  const collect=()=>$$('tbody tr',host).map(tr=>({i:+tr.dataset.i,conta:$('.ic',tr).value,motivo:$('.im',tr).value.trim()}));
  $$('.ic',host).forEach(el=>el.oninput=()=>{const tr=el.closest('tr'),r=inv.righe[+tr.dataset.i],th=giacenza(r.articolo);$('.dd',tr).textContent=el.value===''?'':(()=>{const d=Math.round((+el.value-th)*1000)/1000;return d>0?'+'+d:d})()});
  const save=()=>{const rows=inv.righe.map(r=>Object.assign({},r));collect().forEach(c=>{rows[c.i].conta=c.conta;rows[c.i].motivo=c.motivo});DB.update('inventari',id,{righe:rows});return rows};
  $('#bs',host).onclick=()=>{save();toast('Bozza salvata')};
  $('#ba',host).onclick=async()=>{
    const rows=save();
    if(rows.some(r=>r.conta===''))return UI.err('Inserisci la quantità contata per tutti i beni.',{title:'Dati mancanti'});
    const diff=rows.map(r=>({r,th:giacenza(r.articolo)})).map(x=>Object.assign(x,{d:Math.round((+x.r.conta-x.th)*1000)/1000})).filter(x=>x.d!==0);
    if(diff.some(x=>!x.r.motivo))return UI.err('Inserisci la motivazione per ogni differenza.',{title:'Dati mancanti'});
    if(!await UI.confirm(`Verranno registrate ${diff.length} rettifiche di magazzino e le giacenze saranno aggiornate.`,{title:"Approvare l'inventario?",ok:'Approva'}))return;
    diff.forEach(x=>DB.add('movimenti',{articolo:x.r.articolo,data:today(),tipo:'Rettifica',quantita:x.d,fonte:'Rettifica inventario',note:`Inventario ${fmt(inv.data)}: ${x.r.motivo}`}));
    rows.forEach(r=>{r.teorica=giacenza(r.articolo)});
    DB.update('inventari',id,{righe:rows,stato:'Approvato',approvatoDa:Auth.user.username,approvatoIl:new Date().toISOString()});
    toast('Inventario approvato e rettifiche registrate');refresh();
  };
}

/* =====================================================================
   UTENTI (gestiti solo dall'admin)
   ===================================================================== */
const genPw=()=>{const c='abcdefghjkmnpqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ23456789';let s='';const a=new Uint32Array(10);(window.crypto||{getRandomValues:x=>x.forEach((_,i)=>x[i]=Math.random()*4e9)}).getRandomValues(a);a.forEach(n=>s+=c[n%c.length]);return s};
function renderUtenti(host){
  const l=DB.all('utenti').slice().sort((a,b)=>a.username.localeCompare(b.username));
  host.innerHTML=`<h2>Utenti e accessi</h2><div class="banner">L'amministratore crea gli utenti assegnando nome utente, ruolo e una <b>password iniziale</b>. Al primo accesso l'utente deve sceglierne una propria.</div>
   <div class="toolbar"><button class="btn" id="bn">+ Nuovo utente</button></div>
   <div class="tablewrap"><table><thead><tr><th>Nome utente</th><th>Nome</th><th>Ruolo</th><th>Stato</th><th></th></tr></thead><tbody>${l.map(u=>`<tr data-id="${u.id}"><td><b>${esc(u.username)}</b></td><td>${esc((u.cognome+' '+u.nome).trim())}</td><td>${esc(ROLES[u.ruolo]?ROLES[u.ruolo].l:u.ruolo)}</td><td>${u.attivo?'<span class="badge ok">Attivo</span>':'<span class="badge bad">Disattivato</span>'}${u.mustChange?' <span class="badge warn">Deve cambiare password</span>':''}</td><td class="acts"><button class="btn small ghost" data-e>Modifica</button><button class="btn small gold" data-r>Reimposta password</button></td></tr>`).join('')}</tbody></table></div>`;
  $('#bn',host).onclick=()=>userForm();
  $('tbody',host).onclick=e=>{const t=e.target.closest('button');if(!t)return;const id=t.closest('tr').dataset.id;if(t.dataset.e!==undefined)userForm(id);else if(t.dataset.r!==undefined)resetPw(id)};
}
function roleOpts(){return Object.keys(ROLES).map(k=>`<option value="${k}">${esc(ROLES[k].l)}</option>`).join('')}
function userForm(id){
  const old=id?DB.get('utenti',id):null;
  const fields=[F('username','Nome utente (es. mario.rossi) oppure email','text',{req:1}),F('nome','Nome','text'),F('cognome','Cognome','text'),F('ruolo','Ruolo / livello di accesso','select',{o:Object.keys(ROLES),req:1})];
  if(!old)fields.push(F('password','Password iniziale (min. 8 caratteri)','text',{req:1}));else fields.push(F('attivo','Utente attivo','check'));
  const ov=openForm({title:old?'Modifica utente':'Nuovo utente',fields,values:old?Object.assign({},old):{password:genPw(),ruolo:'volontario'},
    hook(form){
      const s=$('#f_ruolo',form);s.innerHTML='<option value="">—</option>'+roleOpts();s.value=old?old.ruolo:'volontario';
      if(old)$('#f_username',form).disabled=true;
      if(!old){const g=document.createElement('button');g.type='button';g.className='btn small ghost';g.textContent='Genera password casuale';g.onclick=()=>{$('#f_password',form).value=genPw()};$('#f_password',form).parentElement.appendChild(g)}
    },
    async onSave(o){
      if(old){
        if(old.id===Auth.user.id&&(!o.attivo||o.ruolo!=='admin'))return'Non puoi disattivarti o toglierti il ruolo di amministratore.';
        const admins=DB.all('utenti').filter(u=>u.attivo&&u.ruolo==='admin'&&u.id!==old.id).length;
        if(!admins&&(!o.attivo||o.ruolo!=='admin'))return'Deve restare almeno un amministratore attivo.';
        DB.update('utenti',old.id,{nome:o.nome,cognome:o.cognome,ruolo:o.ruolo,attivo:o.attivo});
      }else{
        const u=o.username.trim().toLowerCase();
        if(!(u.includes('@')?/^[^\s@]+@[^\s@]+\.[^\s@]+$/:/^[a-z0-9._-]{3,40}$/).test(u))return'Nome utente non valido (3-40 caratteri: minuscole, numeri . _ -) oppure email non valida.';
        if(DB.all('utenti').some(x=>x.username===u))return'Nome utente già registrato.';
        if(o.password.length<8)return'La password iniziale deve avere almeno 8 caratteri.';
        let cr;const sec=initializeApp(firebaseConfig,'sec'+Date.now());
        try{cr=await createUserWithEmailAndPassword(getAuth(sec),toEmail(u),o.password);await signOut(getAuth(sec))}
        catch(x){return x.code==='auth/email-already-in-use'?'Esiste già un account con questo nome utente (eliminalo prima da Firebase → Authentication).':'Creazione non riuscita ('+x.code+')'}
        finally{deleteApp(sec)}
        DB.add('utenti',{id:cr.user.uid,username:u,nome:o.nome,cognome:o.cognome,ruolo:o.ruolo,attivo:true,mustChange:true});
        await UI.ok('',{title:'Utente creato',html:`<p>Comunica queste credenziali all'interessato: dovrà cambiare la password al primo accesso.</p><div class="cred">Nome utente<br><code>${esc(u)}</code><br><br>Password iniziale<br><code>${esc(o.password)}</code></div>`,copy:`Nome utente: ${u}\nPassword iniziale: ${o.password}`,ok:'Ho annotato le credenziali'});
      }
      refresh();
    }});
}
async function resetPw(id){
  const u=DB.get('utenti',id);
  if(!u.username.includes('@')){await UI.alert('',{title:'Reimpostazione non disponibile',html:`<p><b>${esc(u.username)}</b> non ha un'email, quindi la password non si può reimpostare da qui.</p><p style="text-align:left">Soluzione:<br>1. in Firebase → Authentication elimina l'utente <b>${esc(toEmail(u.username))}</b>;<br>2. in Firestore elimina il documento <b>utenti/${esc(u.id)}</b>;<br>3. ricrealo da "Nuovo utente" con una nuova password iniziale.</p>`});return}
  if(!await UI.confirm(`Verrà inviata un'email a ${u.username} con il link per scegliere una nuova password.`,{title:'Reimpostare la password?',ok:'Invia email'}))return;
  try{await sendPasswordResetEmail(fbAuth,u.username);Audit.log('reset password','utenti',id);UI.ok(`Email inviata a ${u.username}.`,{title:'Email inviata'})}catch(e){UI.err('Invio non riuscito ('+e.code+')',{title:'Errore'})}
}

  const tb=$('tbody',host),inp=$('.search',host);
  const draw=()=>{const q=inp.value.toLowerCase();const l=DB.all('audit').slice().reverse().filter(a=>!q||(a.utente+a.azione+a.coll+a.dett).toLowerCase().includes(q)).slice(0,300);tb.innerHTML=l.map(a=>`<tr><td>${new Date(a.ts).toLocaleString('it-IT')}</td><td>${esc(a.utente)}</td><td>${esc(a.azione)}</td><td>${esc(a.coll)}</td><td>${esc(a.dett||a.rec)}</td></tr>`).join('')||'<tr><td colspan="5" class="empty">Nessuna attività</td></tr>'};
  draw();inp.oninput=draw;
}

function renderImpostazioni(host){
  host.innerHTML=`<h2>Impostazioni e backup</h2>
   <div class="panel"><h3>Backup</h3><p>Scarica una copia completa dei dati (include anche gli account). Conservala in un posto sicuro.</p><button class="btn" id="bx">Scarica backup (JSON)</button>
   <hr style="border:0;border-top:1px solid var(--line);margin:14px 0"><p>Ripristina da un backup (sostituisce tutti i dati attuali).</p><input type="file" id="bi" accept=".json,application/json"></div>
   <div class="panel"><h3>Dati di prova</h3><p>Inserisce alcune persone, beni e record di esempio per provare le funzioni. Da non usare con dati reali.</p><button class="btn gold" id="bd">Carica dati di esempio</button></div>
   <div class="panel"><h3>Dove sono salvati i dati</h3><p>I dati sono salvati online su Firebase e condivisi tra tutti i dispositivi autorizzati. Il backup JSON è una copia di sicurezza aggiuntiva.</p></div>`;
  $('#bx',host).onclick=()=>{download(`backup_caritas_${today()}.json`,JSON.stringify(DB.data,null,1),'application/json');Audit.log('backup','impostazioni')};
  $('#bi',host).onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=async()=>{try{const d=JSON.parse(r.result);if(!d.utenti||!d.utenti.length)throw 0;if(!await UI.confirm('Tutti i dati attuali verranno sostituiti con quelli del backup.',{title:'Ripristinare il backup?',ok:'Ripristina',danger:true}))return;DB.importAll(d);refresh();UI.ok('Il backup è stato ripristinato.')}catch(x){UI.err('Il file selezionato non è un backup valido.',{title:'File non valido'})}};r.readAsText(f)};
  $('#bd',host).onclick=()=>{UI.confirm('Verranno inseriti nel database alcuni dati finti di prova. Non usarlo con i dati reali.',{title:'Aggiungere i dati di esempio?',ok:'Aggiungi'}).then(y=>{if(y){seedDemo();toast('Dati di esempio caricati')}})};
}

/* =====================================================================
   INTERFACCIA: LOGIN, CAMBIO PASSWORD, STRUTTURA
   ===================================================================== */
const LOGOS=['logo.png','logo.jpg','logo.jpeg','logo.webp','logo.svg','Logo.png','Logo.jpg'];
function logoFail(img){const i=(+img.dataset.i||0)+1;if(i<LOGOS.length){img.dataset.i=i;img.src=LOGOS[i]}else{const d=document.createElement('div');d.className='textlogo';d.innerHTML='<span class="cross"></span><span>CARITAS<small>SAN GIOVANNI APOSTOLO</small></span>';img.replaceWith(d)}}
const logoTag=cls=>`<img class="${cls}" alt="Caritas San Giovanni Apostolo" data-i="0" src="${LOGOS[0]}" onerror="logoFail(this)">`;

function showLogin(){
  $('#app').innerHTML=`<div class="loginwrap"><form class="card" id="lf" autocomplete="off">${logoTag('logo')}<h1>App Caritas</h1><div class="sub">Accedi con il nome utente (nome.cognome) e la password forniti dall'amministratore</div>
   <div class="row"><label for="u">Nome utente (nome.cognome) o email</label><input id="u" type="text" autocapitalize="none" autocomplete="username" required></div>
   <div class="row"><label for="p">Password</label><input id="p" type="password" autocomplete="current-password" required></div>
   <div class="err" id="e"></div><button class="btn" style="width:100%">Accedi</button></form></div>`;
  $('#u').focus();
  $('#lf').onsubmit=async e=>{e.preventDefault();const r=await Auth.login($('#u').value,$('#p').value);$('#e').textContent=r||'Accesso in corso…'};
}
function showChangePw(forced){
  $('#app').innerHTML=`<div class="loginwrap"><form class="card" id="cf" autocomplete="off">${logoTag('logo')}<h1>${forced?'Scegli la tua password':'Cambia password'}</h1><div class="sub">${forced?'È il primo accesso (o la password è stata reimpostata): scegli una password personale.':'Inserisci la password attuale e quella nuova.'}</div>
   <div class="row"><label>Password attuale</label><input id="p0" type="password" autocomplete="current-password" required></div>
   <div class="row"><label>Nuova password (min. 8 caratteri)</label><input id="p1" type="password" autocomplete="new-password" required></div>
   <div class="row"><label>Ripeti nuova password</label><input id="p2" type="password" autocomplete="new-password" required></div>
   <div class="err" id="e"></div><button class="btn" style="width:100%">Salva password</button>${forced?'':'<button type="button" class="btn ghost" id="cc" style="width:100%;margin-top:8px">Annulla</button>'}</form></div>`;
  const cc=$('#cc');if(cc)cc.onclick=()=>boot();
  $('#cf').onsubmit=async e=>{
    e.preventDefault();const u=Auth.user,err=$('#e');
    try{await reauthenticateWithCredential(fbAuth.currentUser,EmailAuthProvider.credential(fbAuth.currentUser.email,$('#p0').value))}catch(x){err.textContent='La password attuale non è corretta.';return}
    const n=$('#p1').value;if(n.length<8){err.textContent='La nuova password deve avere almeno 8 caratteri.';return}
    if(n!==$('#p2').value){err.textContent='Le due password non coincidono.';return}
    if(n===$('#p0').value){err.textContent='La nuova password deve essere diversa da quella attuale.';return}
    try{await updatePassword(fbAuth.currentUser,n)}catch(x){err.textContent='Impossibile aggiornare la password ('+x.code+')';return}DB.update('utenti',u.id,{mustChange:false});Audit.log('cambio password','utenti',u.id);Auth.user=DB.get('utenti',u.id);toast('Password aggiornata');boot();
  };
}
function boot(){
  if(!Auth.user)return showLogin();
  if(Auth.user.mustChange)return showChangePw(true);
  if(!can(state.mod))state.mod='dashboard';
  const r=Auth.user.ruolo;
  $('#app').innerHTML=`<header class="top"><button id="burger" aria-label="Menu">☰</button>${logoTag('hlogo')}<div class="tl">App Caritas<small>San Giovanni Apostolo</small></div><div class="sp"></div><div class="who"><b>${esc((Auth.user.nome+' '+Auth.user.cognome).trim()||Auth.user.username)}</b><span><br>${esc(ROLES[r].l)}</span></div><button class="btn small" id="bpw">Password</button><button class="btn small" id="bout">Esci</button></header>
   <div class="layout"><nav class="side" id="nav"></nav><main id="main"></main></div>`;
  $('#burger').onclick=()=>$('#nav').classList.toggle('open');
  $('#bout').onclick=()=>{Auth.logout();showLogin()};
  $('#bpw').onclick=()=>showChangePw(false);
  const nav=$('#nav');
  nav.innerHTML=MODS.filter(m=>can(m.id)).map(m=>`<a data-m="${m.id}">${esc(m.l)}</a>`).join('');
  nav.onclick=e=>{const a=e.target.closest('a');if(!a)return;state.mod=a.dataset.m;state.inv=null;nav.classList.remove('open');refresh()};
  refresh();
}
function refresh(){
  const main=$('#main');if(!main||!Auth.user)return;
  if(!can(state.mod))state.mod='dashboard';
  $$('#nav a').forEach(a=>a.classList.toggle('on',a.dataset.m===state.mod));
  const m=MODS.find(x=>x.id===state.mod);const sy=main.scrollTop;
  if(m.id==='dashboard')return renderDashboard(main);
  if(m.id==='report')return renderReport(main);
  if(m.id==='inventario')return renderInventario(main);
  if(m.id==='utenti')return renderUtenti(main);
  if(m.id==='audit')return renderAudit(main);
  if(m.id==='impostazioni')return renderImpostazioni(main);
  const secs=m.secs;const cur=secs.includes(state.sec[m.id])?state.sec[m.id]:secs[0];
  main.innerHTML=`<h2>${esc(m.l)}</h2><div id="alerts"></div>${secs.length>1?`<div class="tabs">${secs.map(s=>`<button data-s="${s}" class="${s===cur?'on':''}">${esc(SEC_LABEL[s])}</button>`).join('')}</div>`:''}<div id="sec"></div>`;
  if(m.id==='magazzino'){const a=magAlerts();if(a.sotto.length||a.scad.length)$('#alerts',main).innerHTML=`<div class="banner">⚠ ${a.sotto.length?a.sotto.length+' bene/i sottoscorta. ':''}${a.scad.length?a.scad.length+' lotto/i in scadenza entro 30 giorni (o già scaduti).':''}</div>`}
  $$('.tabs button',main).forEach(b=>b.onclick=()=>{state.sec[m.id]=b.dataset.s;refresh()});
  renderSection($('#sec',main),cur,!!m.ro);
}
window.logoFail=logoFail;
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
